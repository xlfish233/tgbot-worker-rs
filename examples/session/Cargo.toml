[package]
name = "session-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["xlfish233 <446304319@qq.com>"]

[package.metadata.release]
release = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.6.1", features = ["http", "d1", "queue"] }
worker-macros = { version = "0.6.1", features = ["http"] }
console_error_panic_hook = { version = "0.1.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.31"

tgbot-worker-rs = { path = "../.." }
