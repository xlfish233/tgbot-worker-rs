# wasm target is pinned via `.cargo/config.toml`

[package]
name = "tgbot-worker-rs"
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
authors = ["xiaolin <446304319@qq.com>"]

[package.metadata.release]
release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "tgbot_worker_rs"
path = "src/lib.rs"

[dependencies]
console_error_panic_hook = { version = "0.1.7" }
frankenstein = { version = "0.45", features = ["client-reqwest"], default-features = false }
worker = { version = "0.7", features = ["http", "d1", "queue"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Optional: enable queue integration when available (matches workers-rs feature "queue")
queue = []
# Optional: enable session with durable objects
session = []
